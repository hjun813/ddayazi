spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:certpath;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate.ddl-auto: ${DDL_AUTO:create-drop}
    open-in-view: false
    properties.hibernate.jdbc.time_zone: UTC
  jackson:
    time-zone: Asia/Seoul
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-bytes}
    expiration-seconds: 3600
  cors.allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
springdoc.swagger-ui.path: /swagger-ui.html
