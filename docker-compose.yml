name: certpath

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-certpath}
      POSTGRES_USER: ${POSTGRES_USER:-certpath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-certpath}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - certpath-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-certpath}
      DB_USERNAME: ${POSTGRES_USER:-certpath}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-certpath}
      DDL_AUTO: ${DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-before-production-123456}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/job-roles || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 35s

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  certpath-postgres: